<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HydroNet 마일스톤 추출기</title>
<style>
  body { font-family: "Malgun Gothic", system-ui, sans-serif; margin: 0; background: #FBF7EF; color: #2B2B2B; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #777; font-size: 13px; margin-bottom: 20px; }
  .card { background: #fff; border: 1px solid #E7DFD0; border-radius: 12px; padding: 16px 18px; margin: 12px 0; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .pname { font-size: 16px; font-weight: 700; }
  .pmeta { font-size: 12px; color: #777; margin-top: 3px; }
  button { font-family: inherit; cursor: pointer; border: none; border-radius: 8px; padding: 9px 14px; font-size: 13px; font-weight: 700; }
  .dl { background: #FA5111; color: #fff; }
  .dl:hover { background: #e0480f; }
  .ghost { background: #F0E9DC; color: #5a5145; }
  .big { display: block; width: 100%; padding: 16px; font-size: 16px; margin: 8px 0 4px; }
  .ok { color: #1E7D4F; } .warn { color: #C0392B; }
  .hint { font-size: 12px; color: #888; margin-top: 10px; line-height: 1.6; }
  textarea { width: 100%; height: 160px; margin-top: 10px; font-family: Consolas, monospace; font-size: 11px; border: 1px solid #E7DFD0; border-radius: 8px; padding: 8px; box-sizing: border-box; }
  .empty { text-align: center; padding: 30px 10px; }
  .empty .warn { font-size: 16px; font-weight: 700; }
  code { background: #F0E9DC; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>HydroNet 마일스톤 추출기</h1>
  <div class="sub">이 브라우저의 HydroNet 저장본(공종·공정·공사기간)을 JSON 파일로 뽑아냅니다.</div>
  <div id="app"></div>
</div>

<script>
(function () {
  var app = document.getElementById('app');

  function safeName(s) {
    return String(s || 'HydroNet').replace(/[\\/:*?"<>|]/g, '_').slice(0, 80).trim() || 'HydroNet';
  }
  function download(filename, text) {
    var blob = new Blob([text], { type: 'application/json;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(a.href); }, 1500);
  }

  // Collect every HydroNet project blob from localStorage (key prefix from the app).
  var projects = [];
  var allDump = {};
  try {
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      var v = localStorage.getItem(k);
      allDump[k] = v;
      if (k && k.indexOf('hydronet:project:') === 0) {
        try {
          var o = JSON.parse(v);
          if (o && o.id && Array.isArray(o.tasks)) {
            projects.push({ key: k, raw: v, obj: o });
          }
        } catch (e) { /* skip non-JSON */ }
      }
    }
  } catch (e) {
    app.innerHTML = '<div class="card warn">localStorage 접근 실패: ' + e + '</div>';
    return;
  }

  // newest first by meta.updatedAt
  projects.sort(function (a, b) {
    return (Date.parse(b.obj && b.obj.meta && b.obj.meta.updatedAt) || 0) -
           (Date.parse(a.obj && a.obj.meta && a.obj.meta.updatedAt) || 0);
  });

  if (!projects.length) {
    app.innerHTML =
      '<div class="card empty">' +
        '<div class="warn">이 브라우저에는 HydroNet 저장본이 없습니다.</div>' +
        '<div class="hint" style="margin-top:14px; text-align:left;">' +
          '가능한 원인:<br>' +
          '1. <b>HydroNet.html 을 열었던 그 브라우저</b>가 아닙니다. → 그 작업을 하던 브라우저(예: Chrome 또는 Edge)로 이 파일을 다시 여세요.<br>' +
          '2. 작업한 PC가 아닙니다. → 마일스톤을 <b>실제로 작업했던 그 PC</b>에서 이 파일을 여세요.<br>' +
          '3. 시크릿(InPrivate) 창에서 작업했다면 저장이 남지 않습니다.<br><br>' +
          '아래는 이 브라우저에 저장된 모든 항목입니다(참고용):' +
        '</div>' +
        '<textarea readonly>' + JSON.stringify(allDump, null, 2).replace(/</g, '&lt;') + '</textarea>' +
      '</div>';
    return;
  }

  var html = '<div class="card"><div class="ok" style="font-weight:700;">✅ 저장본 ' + projects.length + '개 발견</div>';
  html += '<button class="dl big" id="dlLatest">⬇ 가장 최신 프로젝트 JSON 다운로드</button>';
  html += '<div class="hint">아래에서 원하는 항목을 골라 받을 수도 있습니다. 받은 .json 파일을 보내주시면 됩니다.</div></div>';

  projects.forEach(function (p, idx) {
    var o = p.obj;
    var dur = o.tasks.filter(function (t) { return !t.isMilestone; })
                     .reduce(function (s, t) { return s + (t.duration || 0); }, 0);
    var when = (o.meta && o.meta.updatedAt) ? new Date(o.meta.updatedAt).toLocaleString() : '시각 미상';
    html += '<div class="card"><div class="row">' +
      '<div><div class="pname">' + (o.name || '(이름 없음)') + (idx === 0 ? ' <span class="ok" style="font-size:11px;">(최신)</span>' : '') + '</div>' +
      '<div class="pmeta">최종수정 ' + when + ' · 공종 ' + (o.categories ? o.categories.length : 0) +
      ' · 공정/마일스톤 ' + o.tasks.length + ' · 연결 ' + (o.links ? o.links.length : 0) +
      ' · 공사기간합 ' + dur + '일</div></div>' +
      '<button class="dl" data-i="' + idx + '">⬇ JSON 다운로드</button>' +
      '</div></div>';
  });

  html += '<div class="card"><button class="ghost" id="dlAll">전체 백업(저장소 전체) 다운로드</button>' +
    '<div class="hint">위 항목이 비어 보이거나 확실치 않으면 이 전체 백업을 보내주세요.</div></div>';

  app.innerHTML = html;

  document.getElementById('dlLatest').onclick = function () {
    var p = projects[0];
    download(safeName(p.obj.name) + '.json', p.raw);
  };
  Array.prototype.forEach.call(document.querySelectorAll('button.dl[data-i]'), function (btn) {
    btn.onclick = function () {
      var p = projects[+btn.getAttribute('data-i')];
      download(safeName(p.obj.name) + '.json', p.raw);
    };
  });
  document.getElementById('dlAll').onclick = function () {
    download('HydroNet_전체백업.json', JSON.stringify(allDump, null, 2));
  };
})();
</script>
</body>
</html>
